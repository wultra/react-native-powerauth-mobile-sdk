ext {
  //
  // Defaults for the standalone build
  
  PowerAuthSdkRN_kotlinVersion = "2.2.0"
  PowerAuthSdkRN_minSdkVersion = 24
  PowerAuthSdkRN_compileSdkVersion = 37
  PowerAuthSdkRN_ndkVersion = "27.1.12297006"
  PowerAuthSdkRN_reactNativeVersion = "0.87.0"
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

buildscript {
  repositories {
    mavenCentral()
    google()
  }

  dependencies {
    classpath("com.android.tools.build:gradle")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.ext["PowerAuthSdkRN_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.ext["PowerAuthSdkRN_" + name]).toInteger()
}

android {

  namespace = "com.wultra.android.powerauth.reactnative"
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  buildFeatures {
    buildConfig true
  }

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }
  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation("com.facebook.react:react-android")
  implementation("org.jetbrains.kotlin:kotlin-stdlib:${getExtOrDefault("kotlinVersion")}")
  api "com.wultra.android.powerauth:powerauth-sdk:2.0.0"
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src")
    libraryName = "PowerAuthReactNative"
    codegenJavaPackageName = "com.wultra.android.powerauth.reactnative"
  }
}
