ext {
  //
  // Defaults for the standalone build
  
  PowerAuthSdkRN_kotlinVersion = "1.9.22"
  PowerAuthSdkRN_minSdkVersion = 21
  PowerAuthSdkRN_targetSdkVersion = 33
  PowerAuthSdkRN_compileSdkVersion = 33
  PowerAuthSdkRN_ndkversion = "21.4.7075529"
  PowerAuthSdkRN_reactNativeVersion = "0.78.1"
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

buildscript {
  repositories {
    mavenCentral()
    google()
  }

  dependencies {
    classpath("com.android.tools.build:gradle")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.ext["PowerAuthSdkRN_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.ext["PowerAuthSdkRN_" + name]).toInteger()
}

android {

  namespace = "com.wultra.android.powerauth.reactnative"
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  buildFeatures {
    buildConfig true
  }

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }
  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation("com.facebook.react:react-android")
  implementation("org.jetbrains.kotlin:kotlin-stdlib:1.9.22")
  api "com.wultra.android.powerauth:powerauth-sdk:1.9.5"
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../lib")
    libraryName = "PowerAuthReactNative"
    codegenJavaPackageName = "com.wultra.android.powerauth.reactnative"
  }
}
