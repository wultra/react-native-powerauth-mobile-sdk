name: Build

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:

jobs:
  build-ios:
    name: Build Cordova Test App - iOS
    runs-on: macos-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Prepare environment
        uses: ./.github/actions/prepare
      - name: Build Cordova iOS
        run: npm run buildCordovaIos
  build-android:
    name: Build Cordova Test App - Android
    runs-on: macos-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Prepare environment
        uses: ./.github/actions/prepare
      - name: Build Cordova Android
        run: npm run buildCordovaAndroid