name: Delete closed PR caches
on:
  pull_request_target:
    types: [closed]
permissions:
  actions: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # Trusted base workflow only: never check out or execute the PR's code.
      - uses: actions/github-script@v7
        with:
          script: |
            const ref = `refs/pull/${context.payload.pull_request.number}/merge`;
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
              ...context.repo, ref, key: 'pa-ci-v3-', per_page: 100,
            });
            for (const cache of caches) {
              if (cache.ref !== ref || !cache.key.startsWith('pa-ci-v3-')) continue;
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo, pull_number: context.payload.pull_request.number,
              });
              if (pr.state !== 'closed') return; // Ignore delayed/rerun events after reopening.
              try {
                await github.rest.actions.deleteActionsCacheById({ ...context.repo, cache_id: cache.id });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
