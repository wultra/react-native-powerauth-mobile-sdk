name: Build RN Integration

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
  repository_dispatch:
    types:
      - ci-build-react-native
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: build-react-native-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'repository_dispatch' }}

jobs:
  mark-pending:
    name: Mark Pending
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Set pending commit status
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.event.client_payload.commit_sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.COMMIT_SHA,
              state: 'pending',
              context: 'ci/build-react-native',
              description: 'React Native integration build is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  build-ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.client_payload.commit_sha || github.sha }}
      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          env-file: ${{ secrets.ENV_TEST_FILE }}
      - name: Build RN iOS
        run: yarn buildReactIos
  build-android:
    name: Android
    runs-on: macos-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.client_payload.commit_sha || github.sha }}
      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          env-file: ${{ secrets.ENV_TEST_FILE }}
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Build RN Android
        run: yarn buildReactAndroid

  report-status:
    name: Report Status
    if: >-
      always() &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'repository_dispatch')
    needs:
      - mark-pending
      - build-ios
      - build-android
    runs-on: ubuntu-latest
    steps:
      - name: Set final commit status
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.event.client_payload.commit_sha }}
          IOS_RESULT: ${{ needs.build-ios.result }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
        with:
          script: |
            const success =
              process.env.IOS_RESULT === 'success' &&
              process.env.ANDROID_RESULT === 'success';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.COMMIT_SHA,
              state: success ? 'success' : 'failure',
              context: 'ci/build-react-native',
              description: success
                ? 'React Native integration build succeeded'
                : 'React Native integration build failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
