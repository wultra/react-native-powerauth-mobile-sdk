name: Mobile E2E (simulator/emulator)
run-name: ${{ github.workflow }} / ${{ github.event.action || github.event_name }}

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  pr-update-gate:
    name: PR update gate
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Cancel first attempt for a PR update
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'synchronize' &&
          github.run_attempt == 1
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            await new Promise((resolve) => setTimeout(resolve, 30_000));
            core.setFailed('Cancellation was requested, but the workflow is still running.');
      - name: Continue CI
        if: >-
          github.event_name != 'pull_request' ||
          github.event.action != 'synchronize' ||
          github.run_attempt > 1
        run: echo "CI is enabled for this workflow attempt."

  e2e-android-rn:
    needs: pr-update-gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.3.1 --activate

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Write testapp env (.env)
        env:
          ENV_TEST_FILE: ${{ secrets.ENV_TEST_FILE }}
        run: |
          printf '%s\n' "${ENV_TEST_FILE}" > testapp/.env

      - name: Run E2E (Android emulator, RN)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_MODE: rn
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/e2e/run-android-ci.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-android-rn
          path: artifacts/e2e

  e2e-android-cordova:
    needs: pr-update-gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.3.1 --activate

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Write testapp env (.env)
        env:
          ENV_TEST_FILE: ${{ secrets.ENV_TEST_FILE }}
        run: |
          printf '%s\n' "${ENV_TEST_FILE}" > testapp/.env

      - name: Run E2E (Android emulator, Cordova)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_MODE: cordova
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/e2e/run-android-ci.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-android-cordova
          path: artifacts/e2e

  e2e-ios-rn:
    needs: pr-update-gate
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      E2E_COLLECTOR_TIMEOUT: "90m"
      E2E_RUN_START_TIMEOUT_SEC: "5400"
      E2E_COMPLETE_TIMEOUT_SEC: "5400"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect Xcode version
        run: |
          echo "XCODE_VERSION=$(xcodebuild -version | head -n 1 | awk '{print $2}')" >> $GITHUB_ENV

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.3.1 --activate

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Cache CocoaPods (RN)
        uses: actions/cache@v4
        with:
          path: |
            testapp/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-e2e-ios-rn-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('testapp/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-e2e-ios-rn-
            ${{ runner.os }}-e2e-ios-

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Write testapp env (.env)
        env:
          ENV_TEST_FILE: ${{ secrets.ENV_TEST_FILE }}
        run: |
          printf '%s\n' "${ENV_TEST_FILE}" > testapp/.env

      - name: Run E2E (iOS simulator, RN)
        env:
          E2E_MODE: rn
        run: bash scripts/e2e/run-ios-ci.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-ios-rn
          path: artifacts/e2e

  e2e-ios-cordova:
    needs: pr-update-gate
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      E2E_COLLECTOR_TIMEOUT: "90m"
      E2E_RUN_START_TIMEOUT_SEC: "5400"
      E2E_COMPLETE_TIMEOUT_SEC: "5400"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect Xcode version
        run: |
          echo "XCODE_VERSION=$(xcodebuild -version | head -n 1 | awk '{print $2}')" >> $GITHUB_ENV

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.3.1 --activate

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Write testapp env (.env)
        env:
          ENV_TEST_FILE: ${{ secrets.ENV_TEST_FILE }}
        run: |
          printf '%s\n' "${ENV_TEST_FILE}" > testapp/.env

      - name: Run E2E (iOS simulator, Cordova)
        env:
          E2E_MODE: cordova
        run: bash scripts/e2e/run-ios-ci.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-ios-cordova
          path: artifacts/e2e
