name: Mobile E2E (simulator/emulator)

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TEST_COLLECTOR_URL: "http://127.0.0.1:8137"

      POWERAUTH_CLOUD_URL: ${{ secrets.POWERAUTH_CLOUD_URL }}
      POWERAUTH_CLOUD_USERNAME: ${{ secrets.POWERAUTH_CLOUD_USERNAME }}
      POWERAUTH_CLOUD_PASSWORD: ${{ secrets.POWERAUTH_CLOUD_PASSWORD }}
      POWERAUTH_CLOUD_APP_ID: ${{ secrets.POWERAUTH_CLOUD_APP_ID }}
      ENROLLMENT_SERVER_URL: ${{ secrets.ENROLLMENT_SERVER_URL }}
      SDK_CONFIG: ${{ secrets.SDK_CONFIG }}

      UDS_SERVER_URL: ${{ secrets.UDS_SERVER_URL }}
      UDS_SERVER_USERNAME: ${{ secrets.UDS_SERVER_USERNAME }}
      UDS_SERVER_PASSWORD: ${{ secrets.UDS_SERVER_PASSWORD }}

      EXPECTED_RUNS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.3.1 --activate

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Write testapp env (.env)
        run: |
          node scripts/e2e/write-testapp-env.cjs --ci --force

      - name: Run E2E (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: bash scripts/e2e/run-android-ci.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-android
          path: artifacts/e2e

  e2e-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TEST_COLLECTOR_URL: "http://127.0.0.1:8137"

      POWERAUTH_CLOUD_URL: ${{ secrets.POWERAUTH_CLOUD_URL }}
      POWERAUTH_CLOUD_USERNAME: ${{ secrets.POWERAUTH_CLOUD_USERNAME }}
      POWERAUTH_CLOUD_PASSWORD: ${{ secrets.POWERAUTH_CLOUD_PASSWORD }}
      POWERAUTH_CLOUD_APP_ID: ${{ secrets.POWERAUTH_CLOUD_APP_ID }}
      ENROLLMENT_SERVER_URL: ${{ secrets.ENROLLMENT_SERVER_URL }}
      SDK_CONFIG: ${{ secrets.SDK_CONFIG }}

      UDS_SERVER_URL: ${{ secrets.UDS_SERVER_URL }}
      UDS_SERVER_USERNAME: ${{ secrets.UDS_SERVER_USERNAME }}
      UDS_SERVER_PASSWORD: ${{ secrets.UDS_SERVER_PASSWORD }}

      EXPECTED_RUNS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.3.1 --activate

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Write testapp env (.env)
        run: |
          node scripts/e2e/write-testapp-env.cjs --ci --force

      - name: Run E2E (iOS simulator)
        run: bash scripts/e2e/run-ios-ci.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-ios
          path: artifacts/e2e
