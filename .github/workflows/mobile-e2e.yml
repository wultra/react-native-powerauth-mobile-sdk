              `because the PR was updated. This saves CI time; rerun this job to test ` +
              `commit ${context.payload.pull_request.head.sha}.`,
            );
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            await new Promise((resolve) => setTimeout(resolve, 30_000));
            core.setFailed('Cancellation was requested, but the workflow is still running.');
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          env-file: ${{ secrets.ENV_TEST_FILE }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Run E2E (Android emulator, Cordova)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_MODE: cordova
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/e2e/run-android-ci.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-android-cordova
          path: artifacts/e2e

  rn-ios:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
      contents: read
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      E2E_COLLECTOR_TIMEOUT: "90m"
      E2E_RUN_START_TIMEOUT_SEC: "5400"
      E2E_COMPLETE_TIMEOUT_SEC: "5400"
    steps:
      # A PR synchronize event often becomes stale as soon as another commit is pushed.
      # Cancel its first attempt before running the simulator or E2E tests.
      - name: Cancel first attempt for a PR update
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'synchronize' &&
          github.run_attempt == 1
        uses: actions/github-script@v7
        with:
          script: |
            core.info(
              `Cancelling the first attempt for PR #${context.payload.pull_request.number} ` +
              `because the PR was updated. This saves CI time; rerun this job to test ` +
              `commit ${context.payload.pull_request.head.sha}.`,
            );
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            await new Promise((resolve) => setTimeout(resolve, 30_000));
            core.setFailed('Cancellation was requested, but the workflow is still running.');
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          env-file: ${{ secrets.ENV_TEST_FILE }}

      - name: Detect Xcode version
        run: |
          echo "XCODE_VERSION=$(xcodebuild -version | head -n 1 | awk '{print $2}')" >> $GITHUB_ENV

      - name: Cache CocoaPods downloads (RN)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-e2e-ios-rn-cocoapods-v1-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('testapp/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-e2e-ios-rn-cocoapods-v1-
            ${{ runner.os }}-e2e-ios-cocoapods-v1-

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Run E2E (iOS simulator, RN)
        env:
          E2E_MODE: rn
        run: bash scripts/e2e/run-ios-ci.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-ios-rn
          path: artifacts/e2e

  cordova-ios:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
      contents: read
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      E2E_COLLECTOR_TIMEOUT: "90m"
      E2E_RUN_START_TIMEOUT_SEC: "5400"
      E2E_COMPLETE_TIMEOUT_SEC: "5400"
    steps:
      # A PR synchronize event often becomes stale as soon as another commit is pushed.
      # Cancel its first attempt before running the simulator or E2E tests.
      - name: Cancel first attempt for a PR update
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'synchronize' &&
          github.run_attempt == 1
        uses: actions/github-script@v7
        with:
          script: |
            core.info(
              `Cancelling the first attempt for PR #${context.payload.pull_request.number} ` +
              `because the PR was updated. This saves CI time; rerun this job to test ` +
              `commit ${context.payload.pull_request.head.sha}.`,
            );
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            await new Promise((resolve) => setTimeout(resolve, 30_000));
            core.setFailed('Cancellation was requested, but the workflow is still running.');
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          env-file: ${{ secrets.ENV_TEST_FILE }}

      - name: Detect Xcode version
        run: |
          echo "XCODE_VERSION=$(xcodebuild -version | head -n 1 | awk '{print $2}')" >> $GITHUB_ENV

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Run E2E (iOS simulator, Cordova)
        env:
