name: Tests
run-name: ${{ github.workflow }} / ${{ github.event.action || github.event_name }}

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  rn-android:
    name: Android RN (API 36)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # A PR synchronize event often becomes stale as soon as another commit is pushed.
      # Cancel its first attempt before running the emulator or E2E tests.
      - name: Cancel first attempt for a PR update
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'synchronize' &&
          github.run_attempt == 1
        uses: actions/github-script@v7
        with:
          script: |
            core.info(
              `Cancelling the first attempt for PR #${context.payload.pull_request.number} ` +
              `because the PR was updated. This saves CI time; rerun this job to test ` +
              `commit ${context.payload.pull_request.head.sha}.`,
            );
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            await new Promise((resolve) => setTimeout(resolve, 30_000));
            core.setFailed('Cancellation was requested, but the workflow is still running.');
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          env-file: ${{ secrets.ENV_TEST_FILE }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Run E2E (Android emulator, RN)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_MODE: rn
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/e2e/run-android-ci.sh

      - &save-yarn
        uses: ./.github/actions/cache-save
        with:
          family: yarn

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-android-rn-api-36
          path: artifacts/e2e

  cordova-android:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # A PR synchronize event often becomes stale as soon as another commit is pushed.
      # Cancel its first attempt before running the emulator or E2E tests.
      - name: Cancel first attempt for a PR update
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'synchronize' &&
          github.run_attempt == 1
        uses: actions/github-script@v7
        with:
          script: |
            core.info(
              `Cancelling the first attempt for PR #${context.payload.pull_request.number} ` +
              `because the PR was updated. This saves CI time; rerun this job to test ` +
              `commit ${context.payload.pull_request.head.sha}.`,
            );
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            await new Promise((resolve) => setTimeout(resolve, 30_000));
            core.setFailed('Cancellation was requested, but the workflow is still running.');
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          env-file: ${{ secrets.ENV_TEST_FILE }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Run E2E (Android emulator, Cordova)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_MODE: cordova
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/e2e/run-android-ci.sh

      - *save-yarn

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-android-cordova
          path: artifacts/e2e

  rn-ios:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      USE_CCACHE: "1"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: "1G"
      CCACHE_COMPILERCHECK: content
      E2E_COLLECTOR_TIMEOUT: "90m"
      E2E_RUN_START_TIMEOUT_SEC: "5400"
      E2E_COMPLETE_TIMEOUT_SEC: "5400"
    steps:
      # A PR synchronize event often becomes stale as soon as another commit is pushed.
      # Cancel its first attempt before running the simulator or E2E tests.
      - name: Cancel first attempt for a PR update
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'synchronize' &&
          github.run_attempt == 1
        uses: actions/github-script@v7
        with:
          script: |
            core.info(
              `Cancelling the first attempt for PR #${context.payload.pull_request.number} ` +
              `because the PR was updated. This saves CI time; rerun this job to test ` +
              `commit ${context.payload.pull_request.head.sha}.`,
            );
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            await new Promise((resolve) => setTimeout(resolve, 30_000));
            core.setFailed('Cancellation was requested, but the workflow is still running.');
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          env-file: ${{ secrets.ENV_TEST_FILE }}

      - &setup-ruby
        name: Set up Ruby gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.1"
          bundler-cache: true
          working-directory: testapp

      - name: Detect Xcode version
        run: |
          xcodebuild -version | awk '/^Build version/ { print "XCODE_VERSION=" $3 }' >> "$GITHUB_ENV"

      - name: Cache prepared CocoaPods (RN)
        uses: ./.github/actions/cache
        with:
          path: |
            testapp/ios/Pods
            testapp/ios/build/generated/ios
          family: pods-rn
          # Exact snapshots only: native file membership and codegen inputs must match.
          key: installed-v1-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json', 'testapp/Gemfile*', 'testapp/ios/Podfile*', 'testapp/ios/testapp.xcodeproj/project.pbxproj', 'testapp/package.json', 'testapp/react-native.config.js', 'packages/lib-rn/package.json', 'packages/lib-rn/react-native.config.js', 'packages/lib-rn/*.podspec', 'packages/lib-rn/ios/**', 'packages/lib-shared/ios/**', 'scripts/build.mjs', 'scripts/build-layout.cjs', 'scripts/e2e/run-ios-ci.sh') }}

      - name: Set up compiler cache
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO https://github.com/ccache/ccache/releases/download/v4.14/ccache-4.14-darwin.tar.gz
          echo "353a81ea8680d93387102cfde288ebed381a54272cfdc18224f241add6332b39  ccache-4.14-darwin.tar.gz" | shasum -a 256 -c -
          tar -xzf ccache-4.14-darwin.tar.gz
          echo "$RUNNER_TEMP/ccache-4.14-darwin" >> "$GITHUB_PATH"
          echo "CCACHE_VERSION=4.14" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"

      - name: Restore compiler cache (RN)
        uses: ./.github/actions/cache
        with:
          path: ${{ env.CCACHE_DIR }}
          family: ccache-rn
          # ccache validates native edits; stable keys avoid uploading for tiny SDK changes.
          key: xcode${{ env.XCODE_VERSION }}-ccache${{ env.CCACHE_VERSION }}-${{ hashFiles('yarn.lock', 'testapp/ios/Podfile.lock', 'testapp/ios/Podfile', 'testapp/Gemfile.lock', 'scripts/ci/ios-compiler-cache.sh', 'scripts/e2e/run-ios-ci.sh', 'packages/lib-rn/*.podspec', 'testapp/ios/testapp.xcodeproj/project.pbxproj') }}
          # ccache versions can hash identical compiler inputs differently.
          restore-keys: xcode${{ env.XCODE_VERSION }}-ccache${{ env.CCACHE_VERSION }}-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Run E2E (iOS simulator, RN)
        env:
          E2E_MODE: rn
          RN_PODS_CACHE_HIT: ${{ fromJSON(env['PA_CACHE_pods-rn']).hit }}
        run: bash scripts/e2e/run-ios-ci.sh

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats && ccache --show-compression

      - *save-yarn

      - uses: ./.github/actions/cache-save
        with:
          family: pods-rn

      - uses: ./.github/actions/cache-save
        with:
          family: ccache-rn

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-ios-rn
          path: artifacts/e2e

  cordova-ios:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      E2E_COLLECTOR_TIMEOUT: "90m"
      E2E_RUN_START_TIMEOUT_SEC: "5400"
      E2E_COMPLETE_TIMEOUT_SEC: "5400"
    steps:
      # A PR synchronize event often becomes stale as soon as another commit is pushed.
      # Cancel its first attempt before running the simulator or E2E tests.
      - name: Cancel first attempt for a PR update
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'synchronize' &&
          github.run_attempt == 1
        uses: actions/github-script@v7
        with:
          script: |
            core.info(
              `Cancelling the first attempt for PR #${context.payload.pull_request.number} ` +
              `because the PR was updated. This saves CI time; rerun this job to test ` +
              `commit ${context.payload.pull_request.head.sha}.`,
            );
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            await new Promise((resolve) => setTimeout(resolve, 30_000));
            core.setFailed('Cancellation was requested, but the workflow is still running.');
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          env-file: ${{ secrets.ENV_TEST_FILE }}

      - *setup-ruby

      - name: Detect Xcode version
        run: |
          xcodebuild -version | awk '/^Build version/ { print "XCODE_VERSION=" $3 }' >> "$GITHUB_ENV"

      - name: Cache CocoaPods downloads (Cordova)
        uses: ./.github/actions/cache
        with:
          path: ~/Library/Caches/CocoaPods
          family: pods-cordova
          # PowerAuth prepares native frameworks in the download cache.
          key: xcode${{ env.XCODE_VERSION }}-${{ hashFiles('testapp/Gemfile.lock', 'packages/lib-cordova/plugin.xml', 'testapp-cordova/config.xml', 'testapp-cordova/package.json', 'yarn.lock') }}

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Run E2E (iOS simulator, Cordova)
        env:
          E2E_MODE: cordova
          BUNDLE_GEMFILE: ${{ github.workspace }}/testapp/Gemfile
        run: bundle exec bash scripts/e2e/run-ios-ci.sh

      - *save-yarn

      - uses: ./.github/actions/cache-save
        with:
          family: pods-cordova

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-ios-cordova
          path: artifacts/e2e
