name: Mobile E2E (simulator/emulator)

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
  repository_dispatch:
    types:
      - ci-mobile-e2e
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: mobile-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.client_payload.pr_number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'repository_dispatch' }}

jobs:
  mark-pending:
    name: Mark Pending
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Set pending commit status
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.event.client_payload.commit_sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.COMMIT_SHA,
              state: 'pending',
              context: 'ci/mobile-e2e',
              description: 'Mobile E2E tests are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  e2e-android-rn:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.client_payload.commit_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.3.1 --activate

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Write testapp env (.env)
        env:
          ENV_TEST_FILE: ${{ secrets.ENV_TEST_FILE }}
        run: |
          printf '%s\n' "${ENV_TEST_FILE}" > testapp/.env

      - name: Run E2E (Android emulator, RN)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_MODE: rn
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/e2e/run-android-ci.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-android-rn
          path: artifacts/e2e

  e2e-android-cordova:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.client_payload.commit_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.3.1 --activate

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Write testapp env (.env)
        env:
          ENV_TEST_FILE: ${{ secrets.ENV_TEST_FILE }}
        run: |
          printf '%s\n' "${ENV_TEST_FILE}" > testapp/.env

      - name: Run E2E (Android emulator, Cordova)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_MODE: cordova
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/e2e/run-android-ci.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-android-cordova
          path: artifacts/e2e

  e2e-ios-rn:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      E2E_COLLECTOR_TIMEOUT: "90m"
      E2E_RUN_START_TIMEOUT_SEC: "5400"
      E2E_COMPLETE_TIMEOUT_SEC: "5400"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.client_payload.commit_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect Xcode version
        run: |
          echo "XCODE_VERSION=$(xcodebuild -version | head -n 1 | awk '{print $2}')" >> $GITHUB_ENV

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.3.1 --activate

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Cache CocoaPods (RN)
        uses: actions/cache@v4
        with:
          path: |
            testapp/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-e2e-ios-rn-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('testapp/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-e2e-ios-rn-
            ${{ runner.os }}-e2e-ios-

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Write testapp env (.env)
        env:
          ENV_TEST_FILE: ${{ secrets.ENV_TEST_FILE }}
        run: |
          printf '%s\n' "${ENV_TEST_FILE}" > testapp/.env

      - name: Run E2E (iOS simulator, RN)
        env:
          E2E_MODE: rn
        run: bash scripts/e2e/run-ios-ci.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-ios-rn
          path: artifacts/e2e

  e2e-ios-cordova:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      E2E_COLLECTOR_TIMEOUT: "90m"
      E2E_RUN_START_TIMEOUT_SEC: "5400"
      E2E_COMPLETE_TIMEOUT_SEC: "5400"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.client_payload.commit_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect Xcode version
        run: |
          echo "XCODE_VERSION=$(xcodebuild -version | head -n 1 | awk '{print $2}')" >> $GITHUB_ENV

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.3.1 --activate

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Write testapp env (.env)
        env:
          ENV_TEST_FILE: ${{ secrets.ENV_TEST_FILE }}
        run: |
          printf '%s\n' "${ENV_TEST_FILE}" > testapp/.env

      - name: Run E2E (iOS simulator, Cordova)
        env:
          E2E_MODE: cordova
        run: bash scripts/e2e/run-ios-ci.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-ios-cordova
          path: artifacts/e2e

  report-status:
    name: Report Status
    if: >-
      always() &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'repository_dispatch')
    needs:
      - mark-pending
      - e2e-android-rn
      - e2e-android-cordova
      - e2e-ios-rn
      - e2e-ios-cordova
    runs-on: ubuntu-latest
    steps:
      - name: Set final commit status
        uses: actions/github-script@v7
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.event.client_payload.commit_sha }}
          ANDROID_RN_RESULT: ${{ needs.e2e-android-rn.result }}
          ANDROID_CORDOVA_RESULT: ${{ needs.e2e-android-cordova.result }}
          IOS_RN_RESULT: ${{ needs.e2e-ios-rn.result }}
          IOS_CORDOVA_RESULT: ${{ needs.e2e-ios-cordova.result }}
        with:
          script: |
            const results = [
              process.env.ANDROID_RN_RESULT,
              process.env.ANDROID_CORDOVA_RESULT,
              process.env.IOS_RN_RESULT,
              process.env.IOS_CORDOVA_RESULT,
            ];
            const success = results.every((result) => result === 'success');

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.COMMIT_SHA,
              state: success ? 'success' : 'failure',
              context: 'ci/mobile-e2e',
              description: success
                ? 'Mobile E2E tests succeeded'
                : 'Mobile E2E tests failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
