name: Mobile E2E (simulator/emulator)

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  e2e-android-rn:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.3.1 --activate

      - name: Install dependencies
        run: |
          yarn install --immutable

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Write testapp env (.env)
        env:
          ENV_TEST_FILE: ${{ secrets.ENV_TEST_FILE }}
        run: |
          printf '%s\n' "${ENV_TEST_FILE}" > testapp/.env

      - name: Run E2E (Android emulator, RN)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_MODE: rn
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: bash scripts/e2e/run-android-ci.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-android-rn
          path: artifacts/e2e

