name: Tests
run-name: ${{ github.workflow }} / ${{ github.event.action || github.event_name }}

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  rn-android:
    name: Android RN (API ${{ matrix.api-level }})
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 34]
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 34]
    steps:
      # A PR synchronize event often becomes stale as soon as another commit is pushed.
      # Cancel its first attempt before running the emulator or E2E tests.
      - name: Cancel first attempt for a PR update
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'synchronize' &&
          github.run_attempt == 1
        uses: actions/github-script@v7
        with:
          script: |
            core.info(
              `Cancelling the first attempt for PR #${context.payload.pull_request.number} ` +
              `because the PR was updated. This saves CI time; rerun this job to test ` +
              `commit ${context.payload.pull_request.head.sha}.`,
            );
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            await new Promise((resolve) => setTimeout(resolve, 30_000));
            core.setFailed('Cancellation was requested, but the workflow is still running.');
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          env-file: ${{ secrets.ENV_TEST_FILE }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test infra packages
        run: |
          yarn workspace mobile-testbed build
          yarn workspace mobile-test-reporter build
          yarn workspace mobile-test-runner build

      - name: Run E2E (Android emulator, RN)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_MODE: rn
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/e2e/run-android-ci.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-artifacts-android-rn-api-${{ matrix.api-level }}
          path: artifacts/e2e

  cordova-android:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # A PR synchronize event often becomes stale as soon as another commit is pushed.
