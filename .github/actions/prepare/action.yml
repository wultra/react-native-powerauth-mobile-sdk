name: Prepare PowerAuth JS environment
description: Prepare Node.js, Yarn dependencies, and optional testapp .env for PowerAuth JS workflows

inputs:
  env-file:
    description: Contents of the testapp/.env file
    required: false
    default: "empty"

runs:
  using: composite
  steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable Yarn 
        shell: bash
        run: corepack enable
      - name: Install dependencies (Yarn)
        shell: bash
        run: yarn install --immutable
      - name: Set .env file
        shell: bash
        run: |
          echo -e "${{ inputs.env-file }}" > testapp/.env