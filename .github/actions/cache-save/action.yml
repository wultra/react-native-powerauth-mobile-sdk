name: Save and retain CI cache
description: Save successful current builds and prune only after a compatible snapshot is confirmed
inputs:
  family:
    description: Family restored earlier in this job
    required: true
runs:
  using: composite
  steps:
    - id: state
      uses: actions/github-script@v7
      continue-on-error: true
      env:
        CACHE_STATE: ${{ env[format('PA_CACHE_{0}', inputs.family)] }}
      with:
        script: |
          const { state } = require(`${process.env.GITHUB_WORKSPACE}/scripts/ci/cache-policy.cjs`);
          for (const [key, value] of Object.entries(JSON.parse(process.env.CACHE_STATE))) core.setOutput(key, value);
          core.setOutput('current', (await state(github, context)) === 'current');
    - uses: actions/cache/save@v4
      continue-on-error: true
      if: steps.state.outputs.current == 'true' && steps.state.outputs.hit != 'true'
      with:
        path: ${{ steps.state.outputs.path }}
        key: ${{ steps.state.outputs.key }}
    # cache/save has no success output and can warn without failing the step.
    - id: confirmed
      uses: actions/cache/restore@v4
      continue-on-error: true
      if: steps.state.outputs.current == 'true'
      with:
        path: ${{ steps.state.outputs.path }}
        key: ${{ steps.state.outputs.key }}
        lookup-only: true
    - uses: actions/github-script@v7
      continue-on-error: true
      if: steps.state.outputs.current == 'true'
      env:
        CACHE_CONFIRMED: ${{ steps.confirmed.outputs.cache-hit }}
        CACHE_STATE: ${{ env[format('PA_CACHE_{0}', inputs.family)] }}
      with:
        script: |
          const { prune } = require(`${process.env.GITHUB_WORKSPACE}/scripts/ci/cache-policy.cjs`);
          await prune(github, context, JSON.parse(process.env.CACHE_STATE), process.env.CACHE_CONFIRMED === 'true');
