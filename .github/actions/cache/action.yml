name: Restore CI cache
description: Prefer an exact shared snapshot, then a compatible PR snapshot
inputs:
  family:
    description: Cache family with stable paths (distinct per native stack)
    required: true
  path:
    description: Download or compiler-cache paths, never generated apps or credentials
    required: true
  key:
    description: Dependency, toolchain and build-configuration identity
    required: true
  restore-keys:
    description: Optional compatible identity prefix
    default: ''
runs:
  using: composite
  steps:
    # Bump v3 when archive paths change. Never use a commit SHA as the identity.
    - id: exact
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.path }}
        key: pa-ci-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.family }}-${{ inputs.key }}
        lookup-only: true
    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.path }}
        key: ${{ steps.exact.outputs.cache-primary-key }}
        # Without this lookup, a stale PR prefix can shadow an exact base hit.
        restore-keys: ${{ steps.exact.outputs.cache-hit != 'true' && inputs.restore-keys != '' && format('pa-ci-v3-{0}-{1}-{2}-{3}', runner.os, runner.arch, inputs.family, inputs.restore-keys) || '' }}
    - uses: actions/github-script@v7
      env:
        CACHE_FAMILY: ${{ inputs.family }}
        CACHE_PATH: ${{ inputs.path }}
        CACHE_PREFIX: pa-ci-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.family }}-
        CACHE_KEY: ${{ steps.exact.outputs.cache-primary-key }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
      with:
        script: |
          const { CACHE_FAMILY, CACHE_PATH, CACHE_PREFIX, CACHE_KEY, CACHE_HIT } = process.env;
          core.exportVariable(`PA_CACHE_${CACHE_FAMILY}`, JSON.stringify({
            path: CACHE_PATH, prefix: CACHE_PREFIX, key: CACHE_KEY, hit: CACHE_HIT,
          }));
